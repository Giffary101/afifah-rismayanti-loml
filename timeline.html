<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roll Film Kenangan 35mm 🎞️</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Playfair+Display:ital,wght@0,600;0,700;1,400;1,600&family=VT323&display=swap" rel="stylesheet">
  
  <!-- Modular CSS -->
  <link rel="stylesheet" href="css/global.css?v=2.0">
  <link rel="stylesheet" href="css/timeline.css?v=2.0">
</head>
<body class="timeline-body">
  <!-- Canvas Animasi Kelopak Sakura & Hati -->
  <canvas id="ambient-canvas"></canvas>

  <!-- Latar Belakang Dinamis: Foto Terpilih dengan Filter Coklat Vintage Nostalgik -->
  <div class="timeline-vintage-bg">
    <div class="timeline-bg-photo" id="timeline-bg-photo"></div>
    <div class="timeline-bg-overlay"></div>
  </div>

  <!-- Kontrol Suara -->
  <div class="audio-control-bar">
    <button id="sound-btn" class="icon-btn" title="Nyalakan / Matikan Efek Suara">
      <span class="icon">🔔</span>
      <span class="btn-text">Sound: On</span>
    </button>
  </div>

  <main class="timeline-full-container">
    <!-- Bar Navigasi Atas: Tombol Panah Kembali ke Menu Utama -->
    <header class="timeline-top-nav">
      <a href="main.html" class="btn-timeline-back" title="Kembali ke Menu Utama" aria-label="Kembali ke Menu Utama">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
      </a>
    </header>

    <!-- WADAH PITA KLISE FILM 35MM FULL DARI KIRI KE KANAN LAYAR -->
    <div class="film-fullwidth-strip">
      <!-- Pinggiran Atas Klise (Lubang Sprocket & Teks Kodak) -->
      <div class="negative-sprocket-bar sprocket-top">
        <div class="sprocket-holes-backlight"></div>
        <div class="negative-meta-text">
          <span>★ KODAK COLOR 200</span>
          <span>▶ 19</span>
          <span>• 35MM SAFETY FILM •</span>
          <span>▶ 19A</span>
          <span>EXP-36</span>
          <span>▶ 20</span>
          <span>★ KODAK COLOR 200</span>
          <span>▶ 20A</span>
          <span>• 35MM SAFETY FILM •</span>
        </div>
      </div>

      <!-- Viewport Klise Film (Bisa di-scroll dari kiri ke kanan secara penuh) -->
      <div class="negative-scroll-viewport" id="film-track-viewport">
        <div class="negative-frames-row" id="film-track">
          <!-- Frame-frame klise film di-render via js/timeline.js -->
        </div>
      </div>

      <!-- Pinggiran Bawah Klise (Lubang Sprocket & Barcode) -->
      <div class="negative-sprocket-bar sprocket-bottom">
        <div class="negative-meta-text bottom-meta">
          <span>||||||| | |||</span>
          <span>▶ 01A</span>
          <span>▶ 02A</span>
          <span>▶ 03A</span>
          <span>▶ 04A</span>
          <span>▶ 05A</span>
          <span>▶ 06A</span>
          <span>||| || ||||</span>
          <span>▶ 07A</span>
        </div>
        <div class="sprocket-holes-backlight"></div>
      </div>
    </div>

    <!-- Petunjuk Interaksi Bawah -->
    <div class="film-bottom-hint">
      <span>✨ Geser ke kanan / kiri atau klik salah satu klise foto untuk melihatnya tanpa filter</span>
    </div>
  </main>

  <!-- Modular Scripts -->
  <script src="js/audio.js?v=2.0"></script>
  <script src="js/ambient.js?v=2.0"></script>
  <script src="js/timeline.js?v=2.0"></script>
</body>
</html>
